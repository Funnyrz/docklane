name: Prepare and optionally publish release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag with successful CI; this release supports v0.3.0'
        required: true
        default: v0.3.0
        type: string
      publish:
        description: 'Publish a new release only after the candidate has passed all checks'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-prepare-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.verify-ci.outputs.source_sha }}
    steps:
      - name: Validate the requested release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: test "$RELEASE_TAG" = v0.3.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Require successful CI for the exact tagged commit
        id: verify-ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$source_sha&status=success&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          python3 - "$RUNNER_TEMP/ci-runs.json" "$source_sha" "$RUNNER_TEMP/release-ci-evidence.json" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          approved = [run for run in runs if run['head_sha'] == sys.argv[2]
                      and run['conclusion'] == 'success' and run['status'] == 'completed'
                      and run['event'] in ('push', 'workflow_dispatch')]
          if not approved:
              raise SystemExit('No completed, successful CI push/manual run for this exact commit')
          with open(sys.argv[3], 'w') as output:
              json.dump({'head_sha': sys.argv[2], 'ci_run_url': approved[0]['html_url'],
                         'ci_run_id': approved[0]['id'], 'publication': 'candidate'}, output, indent=2)
          PY
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1
          driver: docker
      - name: Build locked frontend, Linux binaries and dual-architecture image archive
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build
          go test -race ./...
          go vet ./...
          rm -rf -- bin/release
          sh scripts/release.sh
          sh scripts/build-images.sh
          cp "$RUNNER_TEMP/release-ci-evidence.json" bin/release/
          sh scripts/package-installation.sh
          cd bin/release
          sha256sum --check SHA256SUMS
          sha256sum --check IMAGE-SHA256SUMS
          for checksum in docklane-v0.3.0-linux-*.tar.gz.sha256; do sha256sum --check "$checksum"; done
          sha256sum --check RELEASE-SHA256SUMS
      - name: Upload reviewable artifacts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-manager-${{ inputs.release_tag }}-candidate-${{ github.run_id }}
          path: bin/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-manager-${{ inputs.release_tag }}-candidate-${{ github.run_id }}
          path: candidate
      - name: Validate candidate, stage draft, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          repo, tag, sha = (os.environ[key] for key in ('GH_REPO', 'RELEASE_TAG', 'SOURCE_SHA'))
          if tag != 'v0.3.0' or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid release identity')
          root = Path('candidate').resolve()
          required = {'SHA256SUMS', 'IMAGE-SHA256SUMS', 'docker-manager-images.tar.gz',
                      'docker-manager-installation.tar.gz', 'IMAGES.txt', 'TOOL-VERSIONS.txt',
                      'SECURITY-NOTES.md', 'LICENSE', 'release-ci-evidence.json', 'install-online.sh'}
          for arch in ('amd64', 'arm64'):
              required.update({f'docklane-linux-{arch}', f'docklane-{tag}-linux-{arch}.tar.gz',
                               f'docklane-{tag}-linux-{arch}.tar.gz.sha256'})

          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1 << 20), b''):
                      value.update(block)
              return value.hexdigest()

          def validate(directory):
              listed = {}
              manifest = directory / 'RELEASE-SHA256SUMS'
              if not manifest.is_file() or manifest.is_symlink():
                  raise SystemExit('Missing checksum manifest')
              for line in manifest.read_text().splitlines():
                  match = re.fullmatch(r'([a-f0-9]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)', line)
                  if not match or match[2] == manifest.name or match[2] in listed:
                      raise SystemExit('Malformed checksum manifest')
                  listed[match[2]] = match[1]
              if not required.issubset(listed):
                  raise SystemExit('Missing required release assets')
              if {path.name for path in directory.iterdir()} != set(listed) | {manifest.name}:
                  raise SystemExit('Unlisted release files')
              for name, expected in listed.items():
                  path = directory / name
                  if not path.is_file() or path.is_symlink() or digest(path) != expected:
                      raise SystemExit('Checksum mismatch: ' + name)
              evidence = json.loads((directory / 'release-ci-evidence.json').read_text())
              if evidence['head_sha'] != sha:
                  raise SystemExit('Candidate was built from another commit')
              return sorted(listed) + [manifest.name], evidence

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def api(path):
              return json.loads(gh('api', 'repos/' + repo + '/' + path))

          def verify_tag():
              obj = api('git/ref/tags/' + tag)['object']
              for _ in range(8):
                  if obj['type'] != 'tag':
                      break
                  obj = api('git/tags/' + obj['sha'])['object']
              if obj['type'] != 'commit' or obj['sha'] != sha:
                  raise SystemExit('Remote tag no longer points at the CI-approved commit')

          names, evidence = validate(root)
          verify_tag()
          pages = json.loads(gh('api', '--paginate', '--slurp', 'repos/' + repo + '/releases?per_page=100'))
          if any(release['tag_name'] == tag for page in pages for release in page):
              raise SystemExit('Release already exists; no existing draft or published release will be overwritten')
          notes = Path(os.environ['RUNNER_TEMP']) / 'release-notes.md'
          notes.write_text(f'''Docklane {tag}

          One-command Linux installation with systemd background service and boot startup.
          Supports Ubuntu 24.04, Debian 12/13, amd64 and arm64.

          ```sh
          curl -fsSL https://raw.githubusercontent.com/{repo}/main/scripts/install-online.sh | sudo bash -s --
          ```

          Download assets from this same release and verify `RELEASE-SHA256SUMS` before offline use.
          Worker archive tags: `docker-manager:{tag}-amd64` and `docker-manager:{tag}-arm64`.
          See the bundled README and SECURITY-NOTES.md for migration, backup and permissions.

          Source commit: {sha}
          Successful exact-commit CI: {evidence['ci_run_url']}
          ''')
          gh('release', 'create', tag, '--repo', repo, '--draft', '--verify-tag',
             '--target', sha, '--title', 'Docklane ' + tag, '--notes-file', str(notes))
          gh('release', 'upload', tag, '--repo', repo, *[str(root / name) for name in names])
          with tempfile.TemporaryDirectory(prefix='verify-release-') as temporary:
              gh('release', 'download', tag, '--repo', repo, '--dir', temporary)
              validate(Path(temporary))
              if digest(Path(temporary) / 'RELEASE-SHA256SUMS') != digest(root / 'RELEASE-SHA256SUMS'):
                  raise SystemExit('Uploaded checksum manifest differs')
          verify_tag()
          gh('release', 'edit', tag, '--repo', repo, '--draft=false', '--latest')
          release = api('releases/tags/' + tag)
          if release['draft'] or release['prerelease']:
              raise SystemExit('Release did not become a formal release')
          print('Published verified release: ' + release['html_url'])
