name: Prepare release artifacts (no publication)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag with successful CI; this release supports v0.3.0'
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-prepare-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate the requested release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: test "$RELEASE_TAG" = v0.3.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Require successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$source_sha&status=success&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          python3 - "$RUNNER_TEMP/ci-runs.json" "$source_sha" "$RUNNER_TEMP/release-ci-evidence.json" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          approved = [run for run in runs if run['head_sha'] == sys.argv[2]
                      and run['conclusion'] == 'success' and run['status'] == 'completed'
                      and run['event'] in ('push', 'workflow_dispatch')]
          if not approved:
              raise SystemExit('No completed, successful CI push/manual run for this exact commit')
          with open(sys.argv[3], 'w') as output:
              json.dump({'head_sha': sys.argv[2], 'ci_run_url': approved[0]['html_url'],
                         'ci_run_id': approved[0]['id'], 'publication': 'not performed'}, output, indent=2)
          PY
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1
          driver: docker
      - name: Build locked frontend, Linux binaries and dual-architecture image archive
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build
          go test -race ./...
          go vet ./...
          sh scripts/release.sh
          sh scripts/build-images.sh
          cp "$RUNNER_TEMP/release-ci-evidence.json" bin/release/
          cp .tool-versions bin/release/TOOL-VERSIONS.txt
          cp docs/security-notes.md bin/release/SECURITY-NOTES.md
          tar -czf bin/release/docker-manager-installation.tar.gz scripts/install.sh scripts/upgrade.sh scripts/uninstall.sh deployments/ README.md README.en.md docker-manager-prd-v0.3.md docs/ web/qa/release-browser-results.json
          cd bin/release
          sha256sum --check SHA256SUMS
          sha256sum --check IMAGE-SHA256SUMS
          for checksum in docklane-v0.3.0-linux-*.tar.gz.sha256; do sha256sum --check "$checksum"; done
          sha256sum docklane-linux-* docklane-v0.3.0-linux-*.tar.gz docker-manager-images.tar.gz docker-manager-installation.tar.gz IMAGES.txt TOOL-VERSIONS.txt SECURITY-NOTES.md release-ci-evidence.json > RELEASE-SHA256SUMS
      - name: Upload reviewable artifacts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-manager-${{ inputs.release_tag }}-candidate-${{ github.run_id }}
          path: bin/release/
          if-no-files-found: error
          retention-days: 14
