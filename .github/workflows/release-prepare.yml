name: Prepare and optionally publish release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable or beta.N tag matching the source package version and successful CI'
        required: true
        default: v0.3.2-beta.2
        type: string
      publish:
        description: 'Publish a new release only after the candidate has passed all checks'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-prepare-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.verify-ci.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Validate the requested release against source version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: python
        run: |
          import json, os, re
          version = json.load(open('web/package.json'))['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[1-9][0-9]*)?', version) or os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match the supported source package version')
      - name: Require successful CI for the exact tagged commit
        id: verify-ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$source_sha&status=success&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          python3 - "$RUNNER_TEMP/ci-runs.json" "$source_sha" "$RUNNER_TEMP/release-ci-evidence.json" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          approved = [run for run in runs if run['head_sha'] == sys.argv[2]
                      and run['conclusion'] == 'success' and run['status'] == 'completed'
                      and run['event'] in ('push', 'workflow_dispatch')]
          if not approved:
              raise SystemExit('No completed, successful CI push/manual run for this exact commit')
          with open(sys.argv[3], 'w') as output:
              version = json.load(open('web/package.json'))['version']
              json.dump({'version': version, 'tag': 'v' + version, 'head_sha': sys.argv[2], 'ci_run_url': approved[0]['html_url'],
                         'ci_run_id': approved[0]['id'], 'publication': 'candidate'}, output, indent=2)
          PY
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1
          driver: docker
      - name: Build locked frontend, Linux binaries and architecture-specific image archives
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build
          go test -race ./...
          go vet ./...
          sh scripts/release.sh
          sh scripts/build-images.sh
          cp "$RUNNER_TEMP/release-ci-evidence.json" bin/release-internal/
          sh scripts/package-installation.sh
          cd bin/release
          sha256sum --check RELEASE-SHA256SUMS
      - name: Upload reviewable artifacts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docklane-${{ inputs.release_tag }}-candidate-${{ github.run_id }}
          path: bin/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the exact CI-approved source for candidate validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Download the candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docklane-${{ inputs.release_tag }}-candidate-${{ github.run_id }}
          path: candidate
      - name: Validate candidate, stage draft, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: python
        run: |
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          repo, tag, sha = (os.environ[key] for key in ('GH_REPO', 'RELEASE_TAG', 'SOURCE_SHA'))
          version = json.loads(Path('web/package.json').read_text())['version']
          if tag != 'v' + version or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[1-9][0-9]*)?', tag) or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid release identity')
          spec = importlib.util.spec_from_file_location('release_preflight', 'scripts/release-preflight.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          root = Path('candidate').resolve()
          beta = '-beta.' in tag

          def digest(path):
              return helper.file_digest(path)

          def validate(directory):
              result = helper.validate_candidate(directory, tag, sha)
              return result['names'], result['evidence']

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def api(path):
              return json.loads(gh('api', 'repos/' + repo + '/' + path))

          def latest_stable_tag():
              # Inspect the actual API response status, never error-message text.
              # A repository containing only prereleases legitimately returns 404.
              result = subprocess.run(['gh', 'api', '--include', 'repos/' + repo + '/releases/latest'],
                                      text=True, capture_output=True)
              headers, separator, body = result.stdout.partition('\n\n')
              status = re.match(r'^HTTP/\S+\s+(\d{3})(?:\s|$)', headers)
              if status and status[1] == '404':
                  return None
              if result.returncode:
                  raise subprocess.CalledProcessError(result.returncode, result.args,
                                                      output=result.stdout, stderr=result.stderr)
              if not separator or not status or status[1] != '200':
                  raise SystemExit('Unexpected response while checking the stable latest release')
              tag_name = json.loads(body).get('tag_name')
              if not isinstance(tag_name, str) or not tag_name:
                  raise SystemExit('Missing stable latest release tag')
              return tag_name

          def verify_tag():
              obj = api('git/ref/tags/' + tag)['object']
              for _ in range(8):
                  if obj['type'] != 'tag':
                      break
                  obj = api('git/tags/' + obj['sha'])['object']
              if obj['type'] != 'commit' or obj['sha'] != sha:
                  raise SystemExit('Remote tag no longer points at the CI-approved commit')

          def verify_ci(evidence):
              run = api('actions/runs/' + str(evidence['ci_run_id']))
              if run.get('head_sha') != sha or run.get('status') != 'completed' or run.get('conclusion') != 'success' or run.get('event') not in ('push', 'workflow_dispatch') or run.get('path', '').split('@', 1)[0] != '.github/workflows/ci.yml':
                  raise SystemExit('Candidate does not reference successful exact-commit CI')

          previous_latest = latest_stable_tag() if beta else None
          names, evidence = validate(root)
          verify_ci(evidence)
          verify_tag()
          pages = json.loads(gh('api', '--paginate', '--slurp', 'repos/' + repo + '/releases?per_page=100'))
          if any(release['tag_name'] == tag for page in pages for release in page):
              raise SystemExit('Release already exists; no existing draft or published release will be overwritten')
          notes = Path(os.environ['RUNNER_TEMP']) / 'release-notes.md'
          channel_argument = ' --channel beta' if beta else ''
          disclaimer = '本程序尚未经过充分、严格的测试，仅供学习与测试使用，请勿用于生产环境。使用前请自行评估风险并备份重要数据。\nThis program has not undergone sufficient, rigorous testing. It is for learning and testing only; do not use it in production. Assess the risks yourself and back up important data before use.'
          notes.write_text(f'''Docklane {tag}

          {disclaimer}

          One-command Linux installation with systemd background service and boot startup.
          Supports Ubuntu 24.04, Debian 12/13, amd64 and arm64.
          新安装默认端口为 9999，源码、二进制、Docker 镜像及安装材料保持一致。
          New installations default to port 9999 across binaries, Docker images and installation materials.
          安装过程显示执行阶段、下载文件与来源尝试，交互式终端显示真实下载进度条。
          Installation shows its stages, download files/source attempts and a real progress bar in interactive terminals.
          已有配置的监听地址会保留；需要切换时显式追加 `--listen :9999`。
          Existing configured listeners are preserved; append `--listen :9999` to change an existing installation.
          服务、账号、标准目录、镜像和附件名称统一为 docklane；旧 docker-manager 部署需自行清理，安装器不会覆盖或自动迁移。
          Service, account, standard directories, images and assets use docklane; legacy deployments are refused without overwrite or automatic migration.
          Service: `docklane.service`; config: `/etc/docklane/config.json`; data: `/var/lib/docklane`.
          This beta does not create or replace a stable release.

          ```sh
          curl -fsSL https://gh-proxy.com/https://raw.githubusercontent.com/{repo}/main/scripts/install-online.sh | sudo bash -s --{channel_argument}
          ```

          Download assets from this same release and verify `RELEASE-SHA256SUMS` before offline use.
          默认仅安装二进制；首次需要工作容器的备份或恢复任务按本机程序架构下载同版本镜像（须匹配本地 Docker Engine）。
          Installs the binary by default; the first backup or restore requiring a worker downloads the matching version for the native executable architecture (matching the local Docker Engine).
          Offline workers: `docklane-images-amd64.tar.gz` and `docklane-images-arm64.tar.gz`.
          Worker archive tags: `docklane:{tag}-amd64` and `docklane:{tag}-arm64`.
          See the installation archive's README and SECURITY-NOTES.md for migration, backup and permissions.

          Source commit: {sha}
          Successful exact-commit CI: {evidence['ci_run_url']}
          ''')
          gh('release', 'create', tag, '--repo', repo, '--draft', '--verify-tag',
             '--target', sha, '--title', 'Docklane ' + tag, '--notes-file', str(notes), *(['--prerelease'] if beta else []))
          gh('release', 'upload', tag, '--repo', repo, *[str(root / name) for name in names])
          with tempfile.TemporaryDirectory(prefix='verify-release-') as temporary:
              gh('release', 'download', tag, '--repo', repo, '--dir', temporary)
              validate(Path(temporary))
              if digest(Path(temporary) / 'RELEASE-SHA256SUMS') != digest(root / 'RELEASE-SHA256SUMS'):
                  raise SystemExit('Uploaded checksum manifest differs')
          verify_tag()
          verify_ci(evidence)
          gh('release', 'edit', tag, '--repo', repo, '--draft=false', '--prerelease=' + str(beta).lower(), '--latest=' + str(not beta).lower())
          release = api('releases/tags/' + tag)
          if release['draft'] or release['prerelease'] != beta:
              raise SystemExit('Release was not published matching the requested channel')
          current_latest = latest_stable_tag()
          if beta and current_latest != previous_latest:
              raise SystemExit('Beta publication changed the stable latest release')
          if not beta and current_latest != tag:
              raise SystemExit('Stable release did not become latest')
          print('Published verified release: ' + release['html_url'])
