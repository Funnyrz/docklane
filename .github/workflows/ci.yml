name: Build and real Docker integration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum
      - name: Frontend dependency lock, types, tests and production assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build
      - name: Backend tests, race detection and static analysis
        run: |
          go test -race ./...
          go vet ./...
          sh -n scripts/integration.sh
          python3 -m py_compile scripts/*.py
          python3 scripts/check-acceptance.py
          for script in scripts/*.sh; do case "$script" in *install-online.sh) bash -n "$script" ;; *) sh -n "$script" ;; esac; done
          python3 scripts/test-install-online.py
          python3 scripts/test-install-support.py
          python3 scripts/test-package-installation.py
          python3 scripts/test-release-preflight.py
          test -z "$(gofmt -l cmd internal)"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=
      - name: Build Linux binaries for both supported architectures
        run: sh scripts/release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-binaries-and-checksums
          path: bin/release/
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    name: Docker ${{ matrix.engine }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        engine: [28.5.1, 29.5.2]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: aarch64
        arch: [amd64, arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      COMPOSE_VERSION: 2.40.3
      RESTIC_VERSION: 0.19.1
      DOCKER_HOST: unix:///tmp/docker-manager-ci-engine.sock
      DM_TEST_DOCKER_ENDPOINT: unix:///tmp/docker-manager-ci-engine.sock
      ENGINE_VERSION: ${{ matrix.engine }}
      DOCKER_ARCH: ${{ matrix.docker_arch }}
      BINARY_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum
      - name: Start pinned Engine in an isolated data directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$DOCKER_ARCH"
          tool_dir="$RUNNER_TEMP/docker-manager-tools"
          mkdir -p "$tool_dir" "$RUNNER_TEMP/docker-manager-evidence"
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/docker-manager-evidence/runner-disk.txt"
          curl --fail --location --retry 3 "https://download.docker.com/linux/static/stable/${DOCKER_ARCH}/docker-${ENGINE_VERSION}.tgz" -o "$tool_dir/docker.tgz"
          sha256sum "$tool_dir/docker.tgz" > "$RUNNER_TEMP/docker-manager-evidence/engine-download.sha256"
          tar -xzf "$tool_dir/docker.tgz" -C "$tool_dir"
          printf '{}\n' > "$tool_dir/engine.json"
          echo "$tool_dir/docker" >> "$GITHUB_PATH"
          # GitHub-hosted disposable VM only. The runner's daemon and data stay untouched.
          sudo ip link add dm-ci0 type bridge
          touch "$RUNNER_TEMP/docker-manager-bridge-owned"
          sudo ip address add 172.31.250.1/24 dev dm-ci0
          sudo ip link set dm-ci0 up
          sudo env PATH="$tool_dir/docker:$PATH" "$tool_dir/docker/dockerd" \
            --config-file "$tool_dir/engine.json" \
            --host "$DOCKER_HOST" --group "$(id -gn)" \
            --data-root "$RUNNER_TEMP/docker-manager-engine-data" \
            --exec-root "$RUNNER_TEMP/docker-manager-engine-exec" \
            --pidfile "$RUNNER_TEMP/docker-manager-engine.pid" \
            --bridge dm-ci0 \
            --default-address-pool base=172.28.0.0/16,size=24 \
            > "$RUNNER_TEMP/docker-manager-evidence/engine.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if "$tool_dir/docker/docker" info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$("$tool_dir/docker/docker" version --format '{{.Server.Version}}')" = "$ENGINE_VERSION"
          "$tool_dir/docker/docker" version > "$RUNNER_TEMP/docker-manager-evidence/docker-version.txt"
          uname -a > "$RUNNER_TEMP/docker-manager-evidence/kernel.txt"
          cat /etc/os-release > "$RUNNER_TEMP/docker-manager-evidence/os-release.txt"
      - name: Install pinned Compose and Restic in private tool directories
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/docker-manager-tools"
          mkdir -p "$tool_dir/docker/cli-plugins"
          curl --fail --location --retry 3 "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-${DOCKER_ARCH}" -o "$tool_dir/docker/cli-plugins/docker-compose"
          curl --fail --location --retry 3 "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/checksums.txt" -o "$tool_dir/compose-checksums.txt"
          compose_expected=$(awk -v expected="docker-compose-linux-${DOCKER_ARCH}" '{name=$2; sub(/^\*/,"",name); if(name==expected) print $1}' "$tool_dir/compose-checksums.txt")
          test -n "$compose_expected"
          printf '%s  %s\n' "$compose_expected" "$tool_dir/docker/cli-plugins/docker-compose" | sha256sum --check --strict
          curl --fail --location --retry 3 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_${BINARY_ARCH}.bz2" -o "$tool_dir/restic.bz2"
          curl --fail --location --retry 3 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/SHA256SUMS" -o "$tool_dir/restic-checksums.txt"
          restic_expected=$(awk -v name="restic_${RESTIC_VERSION}_linux_${BINARY_ARCH}.bz2" '{file=$2; sub(/^\*/,"",file); if(file==name) print $1}' "$tool_dir/restic-checksums.txt")
          test -n "$restic_expected"
          printf '%s  %s\n' "$restic_expected" "$tool_dir/restic.bz2" | sha256sum --check --strict
          bzip2 -dc "$tool_dir/restic.bz2" > "$tool_dir/restic"
          chmod +x "$tool_dir/restic" "$tool_dir/docker/cli-plugins/docker-compose"
          echo "DOCKER_CONFIG=$tool_dir/docker" >> "$GITHUB_ENV"
          echo "DM_TEST_RESTIC=$tool_dir/restic" >> "$GITHUB_ENV"
          echo "DM_TEST_BINARY=$RUNNER_TEMP/docker-manager" >> "$GITHUB_ENV"
          echo "DM_TEST_WORKER_IMAGE=docker-manager:integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "DM_TEST_REPORT=$RUNNER_TEMP/docker-manager-evidence/integration.json" >> "$GITHUB_ENV"
          echo "DM_TEST_TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1
          driver: docker
      - name: Build embedded application and isolated worker image
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          sh scripts/release.sh
          cp "bin/release/docklane-linux-${BINARY_ARCH}" "$DM_TEST_BINARY"
          docker compose version --short
          "$DM_TEST_RESTIC" version
          docker build --tag "$DM_TEST_WORKER_IMAGE" .
          docker image inspect "$DM_TEST_WORKER_IMAGE" > "$RUNNER_TEMP/docker-manager-evidence/worker-image.json"
          go test -race ./...
      - name: Verify real Docker, Compose, Restic and fresh-database recovery
        run: scripts/integration.sh "$DM_TEST_BINARY"
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-linux-docker-${{ matrix.engine }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-manager-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Stop only the owned Engine
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/docker-manager-engine.pid"; then
            owned_pid=$(cat "$RUNNER_TEMP/docker-manager-engine.pid")
            if sudo ps -p "$owned_pid" -o args= | grep -F -- "--data-root $RUNNER_TEMP/docker-manager-engine-data" >/dev/null; then
              sudo kill -TERM "$owned_pid"
              for attempt in $(seq 1 30); do
                if ! sudo kill -0 "$owned_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              if sudo kill -0 "$owned_pid" 2>/dev/null; then
                echo 'Owned Engine did not stop within 30 seconds' >&2
                exit 1
              fi
            fi
          fi
          if test -f "$RUNNER_TEMP/docker-manager-bridge-owned"; then
            sudo ip link delete dm-ci0
          fi
